name: test
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - sei-main

env:
  GO_VERSION: '^1.26'

jobs:

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-go@v5.0.2
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go version
      - run: go install golang.org/x/tools/cmd/goimports@latest
      - run: go install mvdan.cc/gofumpt@latest
      # install.sh mis-greps the release checksums (matches the .sbom.json line
      # too), so install manually with a pinned sha256 instead.
      - run: |
          curl -sSL -o /tmp/gcl.tar.gz https://github.com/golangci/golangci-lint/releases/download/v2.15.0/golangci-lint-2.15.0-linux-amd64.tar.gz
          echo "9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea  /tmp/gcl.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/gcl.tar.gz
          install -m 0755 /tmp/golangci-lint-2.15.0-linux-amd64/golangci-lint "$(go env GOPATH)/bin/"
      - run: echo "PATH=$PATH:/home/runner/go/bin" >> $GITHUB_ENV
      - uses: pre-commit/action@v3.0.1
