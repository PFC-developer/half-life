# Preserve the golangci-lint v1.60 default ruleset the codebase was written
# under. v2 enables revive/gosec by default; adopting those is a separate
# cleanup, not something to bundle into a CVE rebuild.
version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
